# VulnDog release pipeline (M3.3).
#
# Flow:
#   * push of a `v*` tag  -> build sdist + wheel -> upload artifacts -> publish
#     a GitHub Release with those artifacts attached.
#   * workflow_dispatch   -> DRY RUN: the same build + artifact upload, but no
#     GitHub Release is published (the publish job is tag-gated). This is the
#     acceptance path for "tag dry-run produces sdist+wheel artifacts".
#
# Honesty notes:
#   * The full-store release asset (~1.93 GiB) upload is DISABLED below and
#     marked as such — the owner's store-distribution decision (PLAN.md GAP-1)
#     is still open, and no store ships in this tree. See the disabled step.
#   * Publishing uses the runner-preinstalled `gh` CLI with the workflow's own
#     GITHUB_TOKEN — no third-party release action in the supply chain.
#   * Workflow execution is validated on GitHub runners only after a push;
#     locally we validate YAML parsing and the sdist/wheel build path itself.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4

      - name: Set up Python
        # One fixed interpreter for packaging (the matrix lives in ci.yml);
        # the wheel is pure Python (zero runtime deps), so the build
        # interpreter does not constrain the supported versions (>=3.11).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling from the dev extra
        run: python -m pip install -e ".[dev]"

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (tag pushes only)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release and attach sdist + wheel
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # ------------------------------------------------------------------
      # DISABLED — GAP-1 OPEN. Do not enable without the owner's decision.
      #
      # The full prebuilt store is ~1.93 GiB (456,460 records; see
      # docs/VULNERABILITY-DB.md, "Seed vs full vs subset"). GitHub caps a
      # single release asset at 2 GiB, so the asset barely fits and its size
      # MUST be re-verified at release time. The owner's distribution +
      # licensing decision (PLAN.md GAP-1) is still open, and no store ships
      # in this tree — so this upload stays DISABLED and is marked as such.
      #
      # To enable (only after GAP-1 closes): provide the prebuilt store via
      # the STORE_PATH environment variable (built out-of-band per
      # docs/VULNERABILITY-DB.md Steps 1-3), flip `if: false` to a real
      # condition, and keep the <2 GiB gate below — it fails loud, never
      # silently truncates or skips.
      # ------------------------------------------------------------------
      - name: Upload full-store asset (DISABLED - GAP-1 open)
        if: false
        env:
          STORE_PATH: ""
        run: |
          set -eu
          if [ -z "$STORE_PATH" ] || [ ! -f "$STORE_PATH" ]; then
            echo "STORE_PATH must point at the prebuilt store file" >&2
            exit 1
          fi
          size=$(stat -c%s "$STORE_PATH")
          cap=$((2 * 1024 * 1024 * 1024))
          if [ "$size" -ge "$cap" ]; then
            echo "store asset is $size bytes (>= 2 GiB release-asset cap) - refusing upload" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$STORE_PATH" --clobber